services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["54329:5432"]
    volumes: [lmsdata:/var/lib/postgresql/data, ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 3s
      retries: 20
  # Hộp thư giả cho máy phát triển: API gửi email thông báo qua SMTP 1025, xem thư ở http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  lmsdata:
