<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>EmploymentTimeline</title></head>
<body>
<div class="pv-col">
<div class="wf-emp" style="--n:6" role="img" aria-label="Trục thời gian làm việc 2019 đến 2025: FPT 2019–2021, trống 8 tháng, Tiki 2021–2023, VNG 2022–2025 trùng 1 năm với Tiki">

  <div class="wf-emp-row"><span>FPT Software</span><div class="wf-emp-track"><div class="wf-emp-bar" style="--s:0;--w:30">2019–2021</div></div></div>
  <div class="wf-emp-row"><span>Khoảng trống</span><div class="wf-emp-track"><div class="wf-emp-gap" style="--s:30;--w:11">Trống 8 tháng</div></div></div>
  <div class="wf-emp-row"><span>Tiki</span><div class="wf-emp-track"><div class="wf-emp-bar" style="--s:41;--w:39">2021–2023</div></div></div>
  <div class="wf-emp-row"><span>VNG</span><div class="wf-emp-track"><div class="wf-emp-bar wf-emp-bar--overlap" style="--s:52;--w:48">2022–nay</div></div></div>
</div>
<div class="wf-legend"><span><i class="wf-sw" style="background:var(--chart-2)"></i> Thời gian làm việc</span><span><i class="wf-sw" style="background:var(--warning-surface);border:1.5px dashed var(--warning-text)"></i> Khoảng trống</span><span><i class="wf-sw" style="background:repeating-linear-gradient(45deg,var(--chart-2),var(--chart-2) 3px,var(--chart-6) 3px,var(--chart-6) 6px)"></i> Trùng thời gian</span></div>
</div>
