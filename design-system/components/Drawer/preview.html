<html lang="vi">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>Drawer</title></head>
<body>
<div style="display:flex;justify-content:flex-end;background:var(--surface-sunken);padding-left:80px;height:400px"><aside class="wf-drawer" aria-label="Cài đặt khóa học">
