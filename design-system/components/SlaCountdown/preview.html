<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>SlaCountdown</title></head>
<body>
<div class="pv" style="align-items:flex-start;gap:16px">
  <div class="wf-countdown"><div class="wf-countdown-top"><span class="wf-sla wf-sla--ok">Còn thời gian</span><span class="wf-countdown-time">1 giờ 40 phút</span></div><div class="wf-countdown-bar" style="--v:17" role="progressbar" aria-valuenow="17" aria-label="Đã dùng 17% thời hạn"><i></i></div><ul class="wf-countdown-log"><li>Hạn: 16/11 · 12:00 (SLA 2 giờ)</li><li>Mốc nhắc: 11:30</li></ul></div>
  <div class="wf-countdown wf-countdown--soon"><div class="wf-countdown-top"><span class="wf-sla wf-sla--soon">Sắp hết hạn</span><span class="wf-countdown-time">25 phút</span></div><div class="wf-countdown-bar" style="--v:79" role="progressbar" aria-valuenow="79" aria-label="Đã dùng 79% thời hạn"><i></i></div><ul class="wf-countdown-log"><li>Hệ thống đã nhắc người duyệt lúc 11:30</li></ul></div>
  <div class="wf-countdown wf-countdown--over"><div class="wf-countdown-top"><span class="wf-sla wf-sla--over">Quá hạn</span><span class="wf-countdown-time">Quá 15 phút</span></div><div class="wf-countdown-bar" style="--v:100" role="progressbar" aria-valuenow="100" aria-label="Quá hạn"><i></i></div><ul class="wf-countdown-log"><li>11:30 · Đã nhắc người duyệt</li><li>12:00 · Quá hạn, đã chuyển Trưởng khối</li><li><b>Đơn vẫn ở trạng thái Chờ duyệt</b></li></ul></div>
</div>
</body>
</html>
