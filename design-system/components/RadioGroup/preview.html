<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>RadioGroup</title></head>
<body>
<div class="pv" style="align-items:flex-start;gap:40px">
  <fieldset class="wf-radio-group"><legend>Loại nghỉ</legend>
    <label class="wf-radio"><input type="radio" name="r" checked><span>Nghỉ phép năm (còn 7,5 ngày)</span></label>
    <label class="wf-radio"><input type="radio" name="r"><span>Nghỉ không lương</span></label>
    <label class="wf-radio"><input type="radio" name="r" disabled><span>Nghỉ ốm hưởng BHXH · cần giấy xác nhận</span></label>
  </fieldset>
  <fieldset class="wf-radio-group"><legend>Khi hết lượt làm lại</legend>
    <label class="wf-radio"><input type="radio" name="s"><span>Chuyển người phụ trách xử lý</span></label>
    <label class="wf-radio"><input type="radio" name="s"><span>Gia hạn thêm 1 lượt (cần duyệt)</span></label>
  </fieldset>
</div>
</body>
</html>
