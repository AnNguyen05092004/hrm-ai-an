<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>ChatAssistant</title></head>
<body>
<div class="pv" style="align-items:flex-end">
<div class="wf-chat">
  <div class="wf-chat-head"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg><div><b>Trợ lý HR</b><small>Trả lời theo quy chế công ty</small></div></div>

    <div class="wf-bubble wf-bubble--user">Xin nghỉ phép ngày 21/11</div>

  </div>
  <div class="wf-chat-input"><input class="wf-input" placeholder="Hỏi về chính sách, nghỉ phép, OT…" aria-label="Câu hỏi"><button class="wf-btn wf-btn--primary wf-btn--icon" aria-label="Gửi"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6z"/></svg></button></div>
</div>
<button class="wf-fab" aria-label="Mở trợ lý HR"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg></button>
