<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>PromptComposer</title></head>
<body>
<div class="pv-col" style="max-width:720px">
  <h3 class="text-h2" style="margin:0;text-align:center">Bạn muốn tạo nội dung gì?</h3>
  <div class="wf-prompt">
    <label for="pc" class="sr-only" style="position:absolute;left:-9999px">Yêu cầu</label>
    <textarea id="pc" placeholder="Mô tả nội dung, đối tượng, mục tiêu học…">Khóa học 20 phút giúp quản lý duyệt giải trình công đúng quy chế, có 5 câu hỏi kiểm tra cuối bài.</textarea>
    <div class="wf-prompt-foot">
      <button class="wf-btn wf-btn--ghost wf-btn--sm"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg> Tài liệu</button><button class="wf-btn wf-btn--ghost wf-btn--sm"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg> Link</button>
      <span class="wf-attach"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg> Quy chế chấm công 2026.pdf</span>
      <button class="wf-btn wf-btn--primary wf-btn--sm"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg> Tạo dàn ý</button>
    </div>
  </div>
  <div class="pv" style="padding:0"><span class="wf-help">Định dạng:</span><div class="wf-seg"><button aria-pressed="true">Khóa học</button><button aria-pressed="false">Tình huống</button></div></div>
</div>
</body>
</html>
