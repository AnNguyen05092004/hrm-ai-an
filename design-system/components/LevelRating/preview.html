<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>LevelRating</title></head>
<body>
<div class="pv-col"><div class="wf-rating">
  <p class="text-body-strong" style="margin:0">Thiết kế hệ thống</p>
  <div class="wf-levels" role="group" aria-label="Mức năng lực">
    <button class="wf-level" aria-pressed="false">1</button><button class="wf-level" aria-pressed="false">2</button><button class="wf-level" aria-pressed="false">3</button><button class="wf-level wf-level--ai" aria-pressed="true">4</button><button class="wf-level" aria-pressed="false">5</button>
  </div>
  <div class="wf-rating-legend"><span>Tự đánh giá: <b>3</b></span><span>AI gợi ý: <b>4</b> (2 bằng chứng)</span><span>Lead xác nhận: <b>4</b></span><span style="color:var(--warning-text)">Lệch 1 mức so với tự đánh giá</span></div>
</div></div>
</body>
</html>
