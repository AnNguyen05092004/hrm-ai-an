<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>MultiSelect</title></head>
<body>
<div class="pv-col" style="max-width:480px">
  <div class="wf-field"><span class="wf-label">Giao cho <span class="wf-req">*</span></span>
    <div class="wf-multi">
      <span class="wf-tag">Khối Công nghệ<button aria-label="Gỡ Khối Công nghệ"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span>
      <span class="wf-tag">Dự án FuSa<button aria-label="Gỡ Dự án FuSa"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span>
      <input placeholder="Thêm người, nhóm, vai trò…" aria-label="Thêm đối tượng">
    </div>
    <span class="wf-help">Giao cho 142 người.</span>
  </div>
  <div class="wf-menu" role="listbox" style="max-width:300px">
    <div class="wf-menu-label">Phòng ban</div>
    <button class="wf-menu-item" role="option" aria-selected="true"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg> Khối Công nghệ</button>
    <button class="wf-menu-item" role="option">Khối Vận hành</button>
    <div class="wf-menu-label">Dự án</div>
    <button class="wf-menu-item" role="option" aria-selected="true"><svg class="wf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg> Dự án FuSa</button>
    <button class="wf-menu-item" role="option">Dự án VinAI</button>
  </div>
</div>
</body>
</html>
